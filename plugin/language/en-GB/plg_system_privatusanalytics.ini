PLG_SYSTEM_PRIVATUSANALYTICS="System - Privatus Analytics"
PLG_SYSTEM_PRIVATUSANALYTICS_XML_DESCRIPTION="Adds the cookieless Privatus Analytics tracking script to your site. Enter your site id in the options and nothing else is needed. You need a Privatus Analytics account to see reports, and there is a free plan. Sign up at <a href='https://privatusanalytics.com' target='_blank' rel='noopener'>privatusanalytics.com</a>."
PLG_SYSTEM_PRIVATUSANALYTICS_FIELDSET_TRACKING="Tracking"
PLG_SYSTEM_PRIVATUSANALYTICS_FIELDSET_USERS="Users"
PLG_SYSTEM_PRIVATUSANALYTICS_SITE_ID_LABEL="Site ID"
PLG_SYSTEM_PRIVATUSANALYTICS_SITE_ID_DESC="Your Privatus Analytics site id. It starts with pa_ and is in Site settings, Tracking. Nothing is loaded until you enter it."
PLG_SYSTEM_PRIVATUSANALYTICS_SCRIPT_HOST_LABEL="Script host"
PLG_SYSTEM_PRIVATUSANALYTICS_SCRIPT_HOST_DESC="The address that serves /js/pa.js. Change it only if you host your own copy of the script."
PLG_SYSTEM_PRIVATUSANALYTICS_MODULES_LABEL="Modules"
PLG_SYSTEM_PRIVATUSANALYTICS_MODULES_DESC="Optional tracker modules to load. Leave all of them unticked to use the tracker default, which is time on page and scroll depth only."
PLG_SYSTEM_PRIVATUSANALYTICS_MODULE_ENGAGE="Time on page and scroll depth"
PLG_SYSTEM_PRIVATUSANALYTICS_MODULE_AUTO="Automatic events (outbound links, downloads, forms, 404 pages)"
PLG_SYSTEM_PRIVATUSANALYTICS_MODULE_VITALS="Web Vitals"
PLG_SYSTEM_PRIVATUSANALYTICS_MODULE_CLICKS="Click maps"
PLG_SYSTEM_PRIVATUSANALYTICS_MODULE_ASK="On-site surveys"
PLG_SYSTEM_PRIVATUSANALYTICS_EXCLUDE_LABEL="Excluded paths"
PLG_SYSTEM_PRIVATUSANALYTICS_EXCLUDE_DESC="Paths the tracker never counts. Separate them with commas or new lines. A star matches any characters, for example /checkout/*."
PLG_SYSTEM_PRIVATUSANALYTICS_DOMAINS_LABEL="Allowed domains"
PLG_SYSTEM_PRIVATUSANALYTICS_DOMAINS_DESC="Count visits only on these hostnames, separated by commas. Leave it empty to count every host. The match is exact, so example.com does not cover www.example.com."
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_LABEL="Single-page app mode"
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_DESC="How the tracker follows page changes that do not reload the page."
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_AUTO="Automatic"
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_HISTORY="History changes only"
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_HASH="Hash changes only"
PLG_SYSTEM_PRIVATUSANALYTICS_SPA_OFF="Off (page loads only)"
PLG_SYSTEM_PRIVATUSANALYTICS_MANUAL_LABEL="Manual pageviews"
PLG_SYSTEM_PRIVATUSANALYTICS_MANUAL_DESC="Turn off the automatic pageview on load. Choose Yes only if you send pageviews yourself."
PLG_SYSTEM_PRIVATUSANALYTICS_SKIP_LOGGED_IN_LABEL="Skip logged-in users"
PLG_SYSTEM_PRIVATUSANALYTICS_SKIP_LOGGED_IN_DESC="Do not print the script for anyone who is signed in to the site."
PLG_SYSTEM_PRIVATUSANALYTICS_SKIP_GROUPS_LABEL="Skip these user groups"
PLG_SYSTEM_PRIVATUSANALYTICS_SKIP_GROUPS_DESC="Signed-in users in these groups (or groups under them) get no script, so your own visits do not count."
