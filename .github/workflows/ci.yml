name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tag builder tests
        run: php tests/TagBuilderTest.php

  install:
    # Installs the built zip in a real Joomla in Docker and checks the tag.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - joomla:4.4.14-php8.2-apache
          - joomla:5.4.6-php8.3-apache
          - joomla:6.1.0-php8.3-apache
    steps:
      - uses: actions/checkout@v7
      - name: Build the zip and verify it in Joomla
        run: ./scripts/verify-docker.sh ${{ matrix.image }}
